services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: ridam_postgis
    environment:
      POSTGRES_DB: ridam
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  geoserver:
    image: kartoza/geoserver
    container_name: ridam_geoserver
    ports:
      - "8080:8080"
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    depends_on:
      - postgis

  api:
    build: ./api
    container_name: ridam_api
    ports:
      - "8000:8000"
    depends_on:
      - postgis