services:
  frontend:
    build: ./frontend
    container_name: lama_frontend
    restart: always
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: lama_nginx
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend